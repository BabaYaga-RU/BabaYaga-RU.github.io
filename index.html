<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matérias</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: grid; min-height: 100vh; place-items: center; padding: 24px; }
    main { display: grid; width: min(100%, 520px); grid-template-columns: repeat(3, 1fr); gap: 24px 16px; }
    a { display: flex; min-width: 0; flex-direction: column; align-items: center; gap: 9px; color: var(--dark); font: 700 .78rem/1.2 Arial, sans-serif; text-align: center; text-decoration: none; }
    a::before { content: ""; display: grid; width: 82px; height: 82px; place-items: center; border: 1px solid var(--line); border-radius: 21px; color: var(--dark); background: var(--card); box-shadow: 0 8px 18px rgba(21,51,40,.1); transition: transform .2s, background .2s; }
    a:nth-child(1)::before { content: "RN"; color: #fff; background: #0d765d; }
    a:nth-child(2)::before { content: "NET"; color: #fff; background: #e5755f; }
    a:nth-child(3)::before { content: "SD"; color: #fff; background: #4c7890; }
    a:nth-child(4)::before { content: "DIG"; color: #fff; background: #c38a28; }
    a:nth-child(5)::before { content: "SO"; color: #fff; background: #765b8d; }
    a:nth-child(6)::before { content: "ED"; color: #fff; background: #2f8b78; }
    a:nth-child(7)::before { content: "PE"; color: #fff; background: #c35e4e; }
    a:hover::before { transform: translateY(-4px); background: var(--dark); }
    @media (max-width: 430px) { main { grid-template-columns: repeat(2, 1fr); gap: 22px 12px; } }
  </style>
</head>
<body>
  <main aria-label="Matérias">

    <a href="Protocolos-De-Redes-De-Computadores/index.html">Protocolos de Redes</a>
    <a href="Sistema- Distribuidos-e-Processamento-Paralelo/index.html">Sistemas Distribuídos</a>
    <a href="Sistemas-Digitais-Para-Computacao/index.html">Sistemas Digitais</a>
    <a href="Sistemas-Operacionais/index.html">Sistemas Operacionais</a>
    <a href="Laboratorio-de-Eletronica-Digital/index.html">Laboratório de Eletrônica Digital</a>
    <a href="Laboratorio-de-Projetos-Eletronicos/index.html">Laboratório de Projetos Eletrônicos</a>
  </main>
</body>
</html>
